version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nirnay_postgres
    environment:
      POSTGRES_USER: nirnay_user
      POSTGRES_PASSWORD: nirnay_password
      POSTGRES_DB: nirnay_pay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirnay_user -d nirnay_pay"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirnay_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://nirnay_user:nirnay_password@postgres:5432/nirnay_pay
      - APP_ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
